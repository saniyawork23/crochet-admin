
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>theCutiesLoop | Add Order</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #6254d9;
  --primary-light: #eeecff;
  --background: #f7f7fc;
  --white: #ffffff;
  --text: #29283a;
  --muted: #85849a;
  --border: #ececf3;
  --danger: #dc505d;
  --success: #168c67;
  --primary-dark: #5144c4;
  --light-purple: #f1efff;
  --shadow: 0 8px 28px rgba(40,30,80,.07);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Poppins', sans-serif;
  background: var(--background);
  color: var(--text);
}

/* NAVBAR */


/* ===== NAVBAR ===== */

.navbar {
  min-height: 76px;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 4%;
  box-shadow: 0 2px 12px rgba(40,30,80,.05);
  position: sticky;
  top: 0;
  z-index: 100;
  gap: 15px;
}

.nav-left {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.nav-left img {
  width: 46px;
  height: 46px;
  object-fit: contain;
}

.brand-name {
  font-size: 17px;
  font-weight: 700;
  color: #7460dc;
  white-space: nowrap;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 5px;
}

.nav-links a {
  text-decoration: none;
  color: #656176;
  font-size: 12px;
  font-weight: 500;
  padding: 10px 11px;
  border-radius: 8px;
  transition: .2s;
  white-space: nowrap;
}

.nav-links a:hover,
.nav-links a.active {
  color: #7460dc;
  background: #f1efff;
}

.logout-btn {
  border: none;
  background: #fff0f1;
  color: #dc4560;
  padding: 9px 15px;
  border-radius: 8px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  margin-left: 8px;
  transition: .2s;
  white-space: nowrap;
}

.logout-btn:hover {
  background: #ffe0e5;
}

.menu-toggle {
  display: none;
  background: #f1efff;
  border: none;
  color: #7460dc;
  padding: 9px 12px;
  border-radius: 8px;
  font-size: 20px;
  cursor: pointer;
}

/* RESPONSIVE NAVBAR */

@media(max-width: 1050px) {
  .navbar {
    flex-wrap: wrap;
  }

  .menu-toggle {
    display: block;
  }

  .nav-links {
    display: none;
    width: 100%;
    flex-direction: column;
    align-items: stretch;
    padding-top: 15px;
  }

  .nav-links.show {
    display: flex;
  }

  .nav-links a {
    padding: 11px 13px;
    font-size: 13px;
  }

  .logout-btn {
    margin: 8px 0 0;
  }
}

@media(max-width: 600px) {
  .navbar {
    padding: 12px 18px;
  }

  .brand-name {
    font-size: 15px;
  }
}
/* PAGE */

.add-order-page {
  padding: 35px 16px 60px;
  min-height: calc(100vh - 70px);
}

.page-heading {
  text-align: center;
  margin-bottom: 24px;
}

.page-heading h1 {
  font-size: 25px;
  margin: 0;
  font-weight: 600;
}

.page-heading p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 6px;
}

.form-card {
  background: var(--white);
  width: 100%;
  max-width: 760px;
  margin: auto;
  padding: 30px;
  border-radius: 18px;
  box-shadow: var(--shadow);
}

.section-heading {
  font-size: 15px;
  font-weight: 600;
  color: var(--primary);
  margin: 22px 0 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
  margin-bottom: 17px;
  min-width: 0;
}

label {
  font-size: 12px;
  color: #595568;
  font-weight: 500;
  margin-bottom: 7px;
}

input, select {
  width: 100%;
  min-width: 0;
  height: 43px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  transition: 0.2s;
}

input:focus, select:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(114,84,216,0.09);
}

textarea {
  width: 100%;
  min-height: 90px;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: white;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  resize: vertical;
}

textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(114,84,216,0.09);
}

.discount-row {
  display: grid;
  grid-template-columns: 1fr 110px;
  gap: 10px;
}

.total-summary {
  display: flex;
  justify-content: space-between;
  margin: 10px 0;
  font-size: 13px;
  color: var(--muted);
}

.discount-summary {
  color: var(--success);
}

.final-total {
  border-top: 1px solid #e9e2ff;
  padding-top: 12px;
  margin-top: 12px;
  font-weight: 600;
}

/* AUTOCOMPLETE */

.autocomplete-wrapper {
  position: relative;
  width: 100%;
  min-width: 0;
}

.suggestions-box {
  position: absolute;
  top: calc(100% + 5px);
  left: 0;
  right: 0;
  background: white;
  border-radius: 10px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.13);
  max-height: 190px;
  overflow-y: auto;
  z-index: 1000;
  display: none;
  border: 1px solid var(--border);
}

.suggestion-item {
  padding: 10px 13px;
  cursor: pointer;
  font-size: 12px;
  border-bottom: 1px solid #f0eef5;
}

.suggestion-item:last-child {
  border-bottom: none;
}

.suggestion-item:hover {
  background: var(--light-purple);
}

.suggestion-name {
  font-weight: 500;
}

.suggestion-contact {
  font-size: 11px;
  color: var(--muted);
}

/* ITEM SECTION */

.items-header {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(65px, 0.65fr) minmax(90px, 1fr) 35px;
  gap: 10px;
  margin-bottom: 8px;
  padding: 0 3px;
}

.items-header span {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
}

.item-row {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(65px, 0.65fr) minmax(90px, 1fr) 35px;
  gap: 10px;
  align-items: start;
  margin-bottom: 12px;
  width: 100%;
}

.item-row input {
  height: 42px;
  font-size: 12px;
  padding: 9px;
}

.remove-item-btn {
  width: 35px;
  height: 42px;
  border: 1px solid #ffe0e2;
  background: #fff5f5;
  color: var(--danger);
  border-radius: 8px;
  cursor: pointer;
  font-size: 17px;
}

.remove-item-btn:hover {
  background: #ffe5e7;
}

.add-item-btn {
  width: 100%;
  padding: 11px;
  border: 1px dashed var(--primary);
  background: var(--light-purple);
  color: var(--primary);
  border-radius: 9px;
  font-family: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  margin: 3px 0 22px;
}

.add-item-btn:hover {
  background: #eae3ff;
}

/* TOTAL */

.total-box {
  background: #f8f6ff;
  padding: 16px;
  border-radius: 12px;
  border: 1px solid #e9e2ff;
  margin-bottom: 18px;
}

.total-box label {
  color: var(--primary);
  font-weight: 600;
}

.total-box input {
  font-size: 19px;
  font-weight: 600;
  color: var(--primary-dark);
  background: white;
}

/* BUTTON */

.btn-primary {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #8b68ec, #6550cb);
  border: none;
  border-radius: 10px;
  color: white;
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: 0.2s;
}

.btn-primary:hover {
  transform: translateY(-1px);
  box-shadow: 0 5px 15px rgba(114,84,216,0.2);
}

.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.status-message {
  display: none;
  padding: 12px;
  margin-top: 15px;
  border-radius: 9px;
  font-size: 12px;
}

.status-message.error {
  display: block;
  background: #fff0f0;
  color: #bd3030;
}

.status-message.success {
  display: block;
  background: #effaf2;
  color: #237b40;
}

/* RESPONSIVE */

@media (max-width: 850px) {
  .navbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .nav-links {
    gap: 12px;
  }
}

@media (max-width: 520px) {
  .add-order-page {
    padding: 20px 10px 40px;
  }

  .form-card {
    padding: 18px 13px;
    border-radius: 13px;
  }

  .page-heading h1 {
    font-size: 21px;
  }

  .items-header,
  .item-row {
    grid-template-columns: minmax(0, 1.5fr) 58px minmax(75px, 0.9fr) 30px;
    gap: 5px;
  }

  .item-row input {
    padding: 7px 5px;
    font-size: 11px;
  }

  .remove-item-btn {
    width: 30px;
  }

  .nav-links {
    gap: 10px;
  }
}
</style>

<script>
if (localStorage.getItem("isLoggedIn") !== "true") {
  window.location.href = "login.html";
}

function logout() {
  localStorage.removeItem("isLoggedIn");
  window.location.href = "login.html";
}
</script>
</head>

<body>

<!-- NAVBAR -->

<nav class="navbar">
  <div class="nav-left">
    <img src="logo.png" alt="theCutiesLoop Logo">
    <div class="brand-name">theCutiesLoop Admin</div>
  </div>

  <button class="menu-toggle" id="menuToggle"
    type="button"
    aria-label="Toggle navigation"
    aria-expanded="false">☰</button>

  <div class="nav-links" id="navLinks">
    <a href="add-expense.html">Add Expense</a>
    <a href="expenses.html">View Expenses</a>
    <a href="index.html" class="active">Add Order</a>
    <a href="orders.html">View Orders</a>
    <a href="customers.html">Customers</a>
    <a href="dashboard.html">Dashboard</a>
    <button onclick="logout()" class="logout-btn">Logout ↗</button>
  </div>
</nav>


<!-- PAGE -->

<main class="add-order-page">

  <div class="page-heading">
    <h1>Add New Order 🧶</h1>
    <p>Record a new customer order for theCutiesLoop</p>
  </div>

  <div class="form-card">

    <form id="orderForm">

      <!-- CUSTOMER -->

      <h3 class="section-heading">Customer Details</h3>

      <div class="form-group">
        <label for="customerName">Customer Name *</label>
        <div class="autocomplete-wrapper">
          <input type="text" id="customerName"
                 placeholder="Enter customer name"
                 autocomplete="off" required>
          <div id="customerSuggestions" class="suggestions-box"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="contact">Contact Number</label>
        <input type="tel" id="contact"
               placeholder="Enter contact number">
      </div>

      <!-- ITEMS -->

      <h3 class="section-heading">Items Purchased</h3>

      <div class="items-header">
        <span>Item Name</span>
        <span>Qty</span>
        <span>Price (₹)</span>
        <span></span>
      </div>

      <div id="itemsContainer"></div>

      <button type="button" class="add-item-btn" id="addItemBtn">
        + Add Another Item
      </button>

      <!-- ORDER TOTAL & DISCOUNT -->

<div class="total-box">

  <div class="form-group">
    <label>Subtotal (₹)</label>
    <input type="number" id="subtotal" value="0.00" readonly>
  </div>

  <div class="form-group">
    <label for="discountValue">Discount</label>

    <div class="discount-row">
      <input
        type="number"
        id="discountValue"
        min="0"
        max="100"
        step="0.01"
        placeholder="Enter discount"
        value="0"
      >

      <select id="discountType">
        <option value="percent">%</option>
        <option value="rupees">₹</option>
      </select>
    </div>
  </div>

  <div class="total-summary discount-summary">
    <span>Discount Applied</span>
    <span id="discountAmount">₹0.00</span>
  </div>

  <div class="form-group final-total" style="margin:0">
    <label for="total">Final Total (₹)</label>
    <input
      type="number"
      id="total"
      min="0"
      step="0.01"
      value="0.00"
      readonly
      required
    >
  </div>

</div>

<!-- SPECIAL NOTE -->

<div class="form-group">
  <label for="notes">Special Note (Optional)</label>
  <textarea
    id="notes"
    placeholder="E.g. Customisation details, delivery instructions, gift wrapping..."
  ></textarea>
</div>
      <!-- ORDER DETAILS -->

      <h3 class="section-heading">Order Details</h3>

      <div class="form-group">
        <label for="date">Date of Purchase *</label>
        <input type="date" id="date" required>
      </div>

      <div class="form-group">
        <label for="mode">Purchase Mode *</label>
        <select id="mode" required>
          <option value="">Select purchase mode</option>
          <option value="Stall">Stall</option>
          <option value="Online">Online</option>
        </select>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">
        Add Order
      </button>

      <div id="statusMessage" class="status-message"
           role="status" aria-live="polite"></div>

    </form>

  </div>
</main>

<script>

/* =================================
   CONFIGURATION
================================= */

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxBBDXxxpIczdckDg15nBp7IWA0mZE8py92CpBvtXVuwci0ZS-pI7b9f4lawcOXbdlA/exec";

const customerInput = document.getElementById("customerName");
const contactInput = document.getElementById("contact");
const customerSuggestions = document.getElementById("customerSuggestions");
const itemsContainer = document.getElementById("itemsContainer");
const totalInput = document.getElementById("total");
const orderForm = document.getElementById("orderForm");
const submitBtn = document.getElementById("submitBtn");
const statusMessage = document.getElementById("statusMessage");
const subtotalInput = document.getElementById("subtotal");
const discountValueInput = document.getElementById("discountValue");
const discountTypeInput = document.getElementById("discountType");
const discountAmountDisplay = document.getElementById("discountAmount");
const notesInput = document.getElementById("notes");

let customerTimer = null;
const itemTimers = new WeakMap();
const itemRequests = new WeakMap();
let customerRequest = 0;

/* =================================
   INITIALIZATION
================================= */

function initializeForm() {
  document.getElementById("date").value =
    new Date(Date.now() - new Date().getTimezoneOffset() * 60000)
      .toISOString().slice(0, 10);

  // Restore the default percentage mode after a form reset.
  discountTypeInput.value = "percent";
  discountValueInput.max = "100";
  discountValueInput.placeholder = "Enter percentage";

  itemsContainer.innerHTML = "";
  addItemRow();
  calculateTotal();
}

initializeForm();

/* =================================
   ADD ITEM ROW
================================= */

function addItemRow() {

  const row = document.createElement("div");
  row.className = "item-row";

  row.innerHTML = `
    <div class="autocomplete-wrapper">
      <input type="text"
             placeholder="Item name"
             class="item-name"
             autocomplete="off"
             required>
      <div class="suggestions-box item-suggestions"></div>
    </div>

    <input type="number"
           placeholder="Qty"
           class="item-qty"
           min="1"
           step="1"
           required>

    <input type="number"
           placeholder="Price"
           class="item-price"
           min="0"
           step="0.01"
           required>

    <button type="button"
            class="remove-item-btn"
            title="Remove item"
            aria-label="Remove item">×</button>
  `;

  itemsContainer.appendChild(row);

  row.querySelector(".item-name").focus();

  calculateTotal();
}

/* =================================
   REMOVE ITEM
================================= */

itemsContainer.addEventListener("click", function(e) {

  if (!e.target.classList.contains("remove-item-btn")) return;

  const rows = itemsContainer.querySelectorAll(".item-row");

  if (rows.length === 1) {
    alert("At least one item is required.");
    return;
  }

  const row = e.target.closest(".item-row");
  clearTimeout(itemTimers.get(row.querySelector(".item-name")));
  row.remove();

  calculateTotal();
});

document.getElementById("addItemBtn")
  .addEventListener("click", addItemRow);

/* =================================
   AUTOMATIC TOTAL
================================= */

function calculateTotal() {

  let subtotal = 0;

  itemsContainer.querySelectorAll(".item-row").forEach(row => {

    const qty = Number(row.querySelector(".item-qty").value || 0);
    const price = Number(row.querySelector(".item-price").value || 0);

    subtotal += qty * price;

  });

  const discountValue = Math.max(
    0,
    Number(discountValueInput.value || 0)
  );

  let discountAmount = 0;

  if (discountTypeInput.value === "percent") {

    const percentage = Math.min(discountValue, 100);
    discountAmount = subtotal * percentage / 100;

  } else {

    discountAmount = Math.min(discountValue, subtotal);

  }

  subtotal = Math.round((subtotal + Number.EPSILON) * 100) / 100;
  discountAmount = Math.round((discountAmount + Number.EPSILON) * 100) / 100;

  const finalTotal = Math.max(
    0,
    Math.round((subtotal - discountAmount + Number.EPSILON) * 100) / 100
  );

  subtotalInput.value = subtotal.toFixed(2);
  discountAmountDisplay.textContent =
    "₹" + discountAmount.toFixed(2);

  totalInput.value = finalTotal.toFixed(2);

}

/* Recalculate whenever quantity or price changes. */
itemsContainer.addEventListener("input", function(e) {
  if (
    e.target.classList.contains("item-qty") ||
    e.target.classList.contains("item-price")
  ) {
    calculateTotal();
  }
});

/* =================================
   GET ITEMS DATA
================================= */

function getItemsData() {

  return [...itemsContainer.querySelectorAll(".item-row")].map(row => {

    return {
      name: row.querySelector(".item-name").value.trim(),
      qty: row.querySelector(".item-qty").value,
      price: row.querySelector(".item-price").value
    };

  });

}

/* =================================
   CUSTOMER AUTOCOMPLETE
================================= */

customerInput.addEventListener("input", function() {

  const query = this.value.trim();
  const requestId = ++customerRequest;

  contactInput.value = "";
  customerSuggestions.style.display = "none";

  clearTimeout(customerTimer);

  if (query.length < 2) return;

  customerTimer = setTimeout(async () => {

    try {

      const response = await fetch(
        `${SCRIPT_URL}?action=searchCustomers&query=${encodeURIComponent(query)}`
      );

      const customers = await response.json();

      if (requestId !== customerRequest) return;

      showCustomerSuggestions(customers);

    } catch(error) {
      console.error("Customer search error:", error);
    }

  }, 300);

});

function showCustomerSuggestions(customers) {

  customerSuggestions.innerHTML = "";

  if (!Array.isArray(customers) || customers.length === 0) {
    customerSuggestions.style.display = "none";
    return;
  }

  customers.forEach(customer => {

    const div = document.createElement("div");
    div.className = "suggestion-item";

    const name = document.createElement("div");
    name.className = "suggestion-name";
    name.textContent = customer.name || "";

    const contact = document.createElement("div");
    contact.className = "suggestion-contact";
    contact.textContent = customer.contact || "No contact";

    div.append(name, contact);

    div.addEventListener("click", () => {

      customerInput.value = customer.name || "";
      contactInput.value = customer.contact || "";

      customerSuggestions.style.display = "none";

    });

    customerSuggestions.appendChild(div);

  });

  customerSuggestions.style.display = "block";
}

/* =================================
   ITEM AUTOCOMPLETE
================================= */

itemsContainer.addEventListener("input", function(e) {

  if (!e.target.classList.contains("item-name")) return;

  const input = e.target;
  const row = input.closest(".item-row");
  const box = row.querySelector(".item-suggestions");
  const query = input.value.trim();

  clearTimeout(itemTimers.get(input));

  const requestId = (itemRequests.get(input) || 0) + 1;
  itemRequests.set(input, requestId);

  box.style.display = "none";

  if (query.length < 2) return;

  const timer = setTimeout(async () => {

    try {

      const response = await fetch(
        `${SCRIPT_URL}?action=getItemNames&query=${encodeURIComponent(query)}`
      );

      const items = await response.json();

      if (
        !input.isConnected ||
        itemRequests.get(input) !== requestId ||
        input.value.trim() !== query
      ) return;

      showItemSuggestions(items, input, box);

    } catch(error) {
      console.error("Item search error:", error);
    }

  }, 300);

  itemTimers.set(input, timer);

});

function showItemSuggestions(items, input, box) {

  box.innerHTML = "";

  if (!Array.isArray(items) || items.length === 0) {
    box.style.display = "none";
    return;
  }

  items.forEach(item => {

    const div = document.createElement("div");
    div.className = "suggestion-item";
    div.textContent = item;

    div.addEventListener("click", () => {

      input.value = item;
      box.style.display = "none";

    });

    box.appendChild(div);

  });

  box.style.display = "block";
}

/* =================================
   CLOSE AUTOCOMPLETE
================================= */

document.addEventListener("click", function(e) {

  if (!customerSuggestions.contains(e.target) &&
      e.target !== customerInput) {

    customerSuggestions.style.display = "none";

  }

  document.querySelectorAll(".item-suggestions").forEach(box => {

    if (!box.parentElement.contains(e.target)) {
      box.style.display = "none";
    }

  });

});

/* =================================
   STATUS MESSAGE
================================= */

function showMessage(message, type) {

  statusMessage.textContent = message;
  statusMessage.className = "status-message " + type;

}

/* =================================
   FORM VALIDATION
================================= */

function validateItems() {

  const rows = [...itemsContainer.querySelectorAll(".item-row")];

  for (const row of rows) {

    const name = row.querySelector(".item-name").value.trim();
    const qty = Number(row.querySelector(".item-qty").value);
    const price = Number(row.querySelector(".item-price").value);

    if (!name || !Number.isInteger(qty) || qty < 1 ||
        !Number.isFinite(price) || price < 0 ||
        row.querySelector(".item-price").value === "") {

      return false;

    }

  }

  return rows.length > 0;
}

/* =================================
   SUBMIT ORDER
================================= */

orderForm.addEventListener("submit", async function(e) {

  e.preventDefault();

  if (!validateItems()) {

    showMessage(
      "Please check every item name, quantity and price.",
      "error"
    );

    return;
  }

  if (!Number.isFinite(Number(totalInput.value)) ||
      Number(totalInput.value) < 0 ||
      totalInput.value.trim() === "") {

    showMessage("Please enter a valid total amount.", "error");
    return;

  }

  const discountValue = Number(discountValueInput.value || 0);

  if (!Number.isFinite(discountValue) || discountValue < 0) {
    showMessage("Please enter a valid non-negative discount.", "error");
    discountValueInput.focus();
    return;
  }

  if (discountTypeInput.value === "percent" && discountValue > 100) {
    showMessage("Percentage discount cannot exceed 100%.", "error");
    discountValueInput.focus();
    return;
  }

  const params = new URLSearchParams({

  action: "addOrderWithDiscount",

  customerName: customerInput.value.trim(),
  contact: contactInput.value.trim(),

  date: document.getElementById("date").value,
  purchaseMode: document.getElementById("mode").value,

  total: totalInput.value,
  discountGiven: discountAmountDisplay.textContent.replace("₹", ""),

  notes: notesInput.value.trim(),

  items: JSON.stringify(getItemsData())

});

  submitBtn.disabled = true;
  submitBtn.textContent = "Submitting...";

  try {

    /*
      Keeping the existing Apps Script GET integration.
      no-cors means the browser cannot read the server response.
    */

    await fetch(`${SCRIPT_URL}?${params.toString()}`, {
      method: "GET",
      mode: "no-cors"
    });

    showMessage(
      "Request sent. Please verify the order in View Orders before submitting it again.",
      "success"
    );

    orderForm.reset();
    initializeForm();

  } catch(error) {

    console.error("Order submission error:", error);

    showMessage(
      "Unable to send the order. Please check your internet connection and try again.",
      "error"
    );

  } finally {

    submitBtn.disabled = false;
    submitBtn.textContent = "Add Order";

  }

});

discountValueInput.addEventListener("input", calculateTotal);

discountTypeInput.addEventListener("change", function() {
  if (discountTypeInput.value === "percent") {
    discountValueInput.max = "100";
    discountValueInput.placeholder = "Enter percentage";
  } else {
    discountValueInput.removeAttribute("max");
    discountValueInput.placeholder = "Enter amount";
  }

  calculateTotal();
});


// MOBILE NAVIGATION
document.getElementById("menuToggle").addEventListener("click", function() {
  const nav = document.getElementById("navLinks");
  const isOpen = nav.classList.toggle("show");

  this.setAttribute("aria-expanded", String(isOpen));
  this.textContent = isOpen ? "✕" : "☰";
});


</script>
